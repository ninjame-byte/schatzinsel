<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>🏴‍☠️ Schatzinsel</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: #0e0904;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
      }
      #app {
        width: 100%;
        max-width: 760px;
        height: 100vh;
        max-height: 950px;
        position: relative;
        overflow: hidden;
        background: #0e0904;
        transition: background 0.8s ease;
      }
      .screen {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        padding: 18px;
      }
      .screen.active {
        display: flex;
      }
      .center {
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      /* ===== START ===== */
      .start-bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 20% 20%, rgba(255, 180, 60, 0.14), transparent 45%),
          radial-gradient(circle at 80% 75%, rgba(80, 160, 255, 0.1), transparent 45%),
          linear-gradient(160deg, #2a1a0a 0%, #120a04 100%);
      }
      .start-content {
        position: relative;
        z-index: 2;
        width: 100%;
      }
      .logo {
        font-size: clamp(54px, 14vw, 96px);
        filter: drop-shadow(0 10px 30px rgba(255, 180, 50, 0.5));
        animation: float 3s ease-in-out infinite;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }
      h1 {
        font-size: clamp(28px, 6.5vw, 46px);
        font-weight: 800;
        background: linear-gradient(180deg, #ffe066, #ffb347, #ff8c00);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 6px 0 4px;
        letter-spacing: 1px;
      }
      .sub {
        font-size: clamp(13px, 3vw, 17px);
        color: #c9b48a;
        margin-bottom: 22px;
      }

      .crew-row {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .crew-btn {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        padding: 0;
        transition: transform 0.18s;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .crew-btn:active {
        transform: scale(0.94);
      }
      .crew-fig {
        width: clamp(120px, 30vw, 170px);
        height: auto;
        filter: drop-shadow(0 12px 26px rgba(0, 0, 0, 0.55));
        transition: filter 0.2s;
      }
      .crew-btn:hover .crew-fig {
        filter: drop-shadow(0 12px 34px rgba(255, 190, 70, 0.65));
      }
      .crew-label {
        margin-top: 6px;
        font-size: clamp(14px, 3.2vw, 18px);
        font-weight: 800;
        color: #ffe9b0;
        letter-spacing: 0.5px;
      }
      .hint {
        font-size: 12px;
        color: #8a7448;
        margin-top: 20px;
      }

      /* ===== KARTE ===== */
      #screen-map {
        padding: 0;
      }

      .map-header {
        position: absolute;
        top: 26px;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 14px;
        pointer-events: none;
        gap: 6px;
        flex-wrap: wrap;
      }
      .pill {
        pointer-events: auto;
        background: rgba(30, 20, 8, 0.82);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 215, 130, 0.35);
        border-radius: 30px;
        padding: 7px 14px;
        font-size: clamp(12px, 2.8vw, 15px);
        font-weight: 700;
        display: flex;
        gap: 6px;
        align-items: center;
        color: #ffe9b0;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        white-space: nowrap;
      }
      .pill.icon-only {
        padding: 7px 11px;
        cursor: pointer;
        font-size: 17px;
      }
      .pill.reise-pill {
        background: rgba(126, 217, 87, 0.3);
        border-color: rgba(126, 217, 87, 0.55);
        color: #d4ffb0;
      }

      .map-wrap {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 88px 8px 12px;
      }

      .pergament {
        position: relative;
        width: 100%;
        height: 100%;
        max-width: 640px;
        max-height: 860px;
        filter: drop-shadow(0 24px 60px rgba(0, 0, 0, 0.75));
        transition: filter 0.8s ease;
      }
      .pergament-inner {
        position: absolute;
        inset: 0;
        border-radius: 10px;
        background:
          radial-gradient(ellipse at 30% 20%, rgba(170, 125, 60, 0.22), transparent 55%),
          radial-gradient(ellipse at 75% 80%, rgba(130, 90, 40, 0.24), transparent 55%),
          repeating-linear-gradient(7deg, rgba(104, 67, 28, 0.025) 0px, rgba(104, 67, 28, 0.025) 1px, transparent 1px, transparent 5px),
          radial-gradient(circle at 50% 50%, #f5e4bd 0%, #e9d2a1 48%, #d4b477 100%);
        overflow: hidden;
        transition: background 0.8s ease;
        clip-path: polygon(
          0% 3%,
          2% 1%,
          6% 2%,
          10% 0.5%,
          15% 2%,
          21% 0.8%,
          28% 2.2%,
          35% 0.5%,
          43% 2%,
          51% 0.6%,
          59% 2.2%,
          67% 0.8%,
          75% 2%,
          82% 0.5%,
          89% 2%,
          95% 0.8%,
          99% 3%,
          98% 8%,
          100% 14%,
          98.5% 21%,
          100% 28%,
          98.8% 36%,
          100% 44%,
          98.5% 52%,
          100% 60%,
          98.8% 68%,
          100% 76%,
          98.5% 84%,
          99.5% 91%,
          97% 97%,
          91% 98.5%,
          84% 97%,
          76% 99%,
          68% 97.5%,
          60% 99%,
          52% 97.2%,
          44% 99%,
          36% 97.5%,
          28% 99%,
          20% 97.2%,
          12% 98.8%,
          6% 97%,
          1.5% 94%,
          2.5% 88%,
          0.5% 81%,
          2% 74%,
          0% 66%,
          1.8% 58%,
          0% 50%,
          2% 42%,
          0% 34%,
          1.8% 26%,
          0% 18%,
          2% 10%
        );
      }
      .pergament-inner::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(60, 30, 5, 0.55), transparent 18%),
          radial-gradient(ellipse at 50% 100%, rgba(60, 30, 5, 0.55), transparent 18%),
          radial-gradient(ellipse at 0% 50%, rgba(60, 30, 5, 0.5), transparent 16%),
          radial-gradient(ellipse at 100% 50%, rgba(60, 30, 5, 0.5), transparent 16%),
          radial-gradient(ellipse at 12% 12%, rgba(90, 50, 15, 0.35), transparent 22%),
          radial-gradient(ellipse at 88% 88%, rgba(90, 50, 15, 0.35), transparent 22%);
        pointer-events: none;
        z-index: 3;
      }
      .pergament-inner::after {
        content: "";
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 70px rgba(70, 35, 5, 0.65);
        pointer-events: none;
        z-index: 3;
      }

      .map-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }

      #truhenLayer {
        position: absolute;
        inset: 0;
        z-index: 4;
      }
      .truhe-node {
        position: absolute;
        transform: translate(-50%, -50%);
        width: clamp(36px, 8vw, 50px);
        height: clamp(36px, 8vw, 50px);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 23px;
        cursor: pointer;
        user-select: none;
        background: radial-gradient(circle, #fff4d0 0%, #e8c67a 100%);
        border: 2px solid #8a6030;
        box-shadow:
          0 5px 14px rgba(60, 30, 5, 0.55),
          inset 0 -2px 6px rgba(120, 70, 20, 0.3);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .truhe-node.locked {
        opacity: 0.5;
        cursor: default;
        filter: grayscale(0.45);
      }
      .truhe-node.done {
        background: radial-gradient(circle, #fff3a0 0%, #ffd24a 100%);
        border-color: #b8860b;
        box-shadow:
          0 0 18px rgba(255, 200, 80, 0.75),
          0 5px 14px rgba(60, 30, 5, 0.55);
      }
      .truhe-node.current {
        background: radial-gradient(circle, #fff8d0 0%, #ffb347 100%);
        border-color: #ff8c00;
        animation: glow 1.6s ease-in-out infinite;
      }
      @keyframes glow {
        0%,
        100% {
          box-shadow:
            0 0 14px rgba(255, 170, 50, 0.6),
            0 5px 14px rgba(60, 30, 5, 0.55);
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          box-shadow:
            0 0 30px rgba(255, 190, 70, 1),
            0 5px 14px rgba(60, 30, 5, 0.55);
          transform: translate(-50%, -50%) scale(1.1);
        }
      }
      .truhe-node:not(.locked):active {
        transform: translate(-50%, -50%) scale(0.9);
      }
      .station-num {
        position: absolute;
        bottom: -6px;
        right: -6px;
        background: #5a3a18;
        color: #ffe9b0;
        font-weight: 800;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        border: 2px solid #f0dcb0;
      }

      /* ===== TRUHE GROSS ===== */
      .overlay {
        position: absolute;
        inset: 0;
        z-index: 50;
        background: rgba(8, 4, 1, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 20px;
      }
      .overlay.active {
        display: flex;
      }
      .truhe-big {
        font-size: clamp(120px, 32vw, 200px);
        cursor: pointer;
        user-select: none;
        filter: drop-shadow(0 20px 50px rgba(255, 180, 50, 0.5));
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        animation: bounce 1.4s ease-in-out infinite;
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-14px) scale(1.04);
        }
      }
      .truhe-big:active {
        transform: scale(0.92);
      }
      .truhe-big.opening {
        animation: openPop 0.5s ease-out forwards;
      }
      @keyframes openPop {
        0% {
          transform: scale(1);
        }
        60% {
          transform: scale(1.3);
        }
        100% {
          transform: scale(0);
          opacity: 0;
        }
      }
      .overlay-text {
        font-size: clamp(16px, 3.5vw, 20px);
        color: #e8c67a;
        margin-top: 10px;
        font-weight: 600;
      }

      /* ===== AUFGABE ===== */
      #screen-task {
        justify-content: flex-start;
        background: linear-gradient(180deg, #2a1a0a, #120a04);
      }
      .task-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
        gap: 8px;
        flex-wrap: wrap;
      }
      .task-card {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #f2ddb0 0%, #cfab66 100%);
        border: 6px solid #8a6030;
        border-radius: 24px;
        padding: 30px 22px;
        text-align: center;
        position: relative;
        overflow: hidden;
        box-shadow:
          0 20px 50px rgba(0, 0, 0, 0.65),
          inset 0 0 60px rgba(120, 80, 30, 0.25);
        color: #3a2408;
      }
      .task-card::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.15), transparent 60%);
        pointer-events: none;
      }
      .task-icon {
        font-size: clamp(56px, 14vw, 84px);
        margin-bottom: 16px;
        position: relative;
      }
      .task-text {
        font-size: clamp(21px, 5vw, 30px);
        font-weight: 700;
        line-height: 1.35;
        margin-bottom: 24px;
        position: relative;
      }

      .btn {
        font-family: inherit;
        cursor: pointer;
        border: none;
        padding: 16px 30px;
        border-radius: 18px;
        font-size: clamp(16px, 3.6vw, 20px);
        font-weight: 700;
        transition: transform 0.12s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .btn:active {
        transform: scale(0.95);
      }
      .btn-listen {
        background: rgba(70, 120, 180, 0.25);
        border: 1px solid rgba(70, 120, 180, 0.6);
        color: #3a6a9a;
      }
      .btn-done {
        background: linear-gradient(180deg, #7ed957, #4caf50);
        color: #fff;
        box-shadow: 0 8px 24px rgba(76, 175, 80, 0.4);
      }

      .task-timer {
        color: #ffe9b0;
        text-align: center;
        font-weight: 800;
        font-size: 16px;
        margin: 8px 0 2px;
      }
      .task-timer.urgent { color: #ff8b6b; }
      .task-help {
        display: none;
        margin: 12px 0 0;
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(255,255,255,.72);
        color: #3a2408;
        font-size: 16px;
        line-height: 1.4;
        font-weight: 650;
      }
      .task-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        align-items: center;
        margin-top: 10px;
        margin-bottom: 6px;
      }
      .btn-small {
        font-family: inherit;
        cursor: pointer;
        padding: 10px 20px;
        border-radius: 14px;
        font-size: clamp(13px, 3vw, 16px);
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: transform 0.12s;
        background: linear-gradient(180deg, #a87a48 0%, #7a5228 100%);
        color: #ffe9b0;
        border: 2px solid #5a3a18;
        box-shadow:
          0 4px 0 #4a2a10,
          0 6px 14px rgba(0, 0, 0, 0.4);
      }
      .btn-small:active {
        transform: translateY(3px);
        box-shadow:
          0 1px 0 #4a2a10,
          0 3px 8px rgba(0, 0, 0, 0.4);
      }

      /* ===== REWARD ===== */
      #screen-reward {
        background: linear-gradient(180deg, #2a1a0a, #120a04);
      }
      .reward-star {
        font-size: clamp(90px, 24vw, 150px);
        animation: starSpin 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      @keyframes starSpin {
        0% {
          transform: scale(0) rotate(-180deg);
        }
        100% {
          transform: scale(1) rotate(0);
        }
      }
      .reward-title {
        font-size: clamp(24px, 5.5vw, 34px);
        font-weight: 800;
        color: #ffd966;
        margin: 10px 0;
      }
      .reward-sub {
        font-size: clamp(14px, 3.2vw, 18px);
        color: #c9b48a;
        margin-bottom: 26px;
      }

      /* ===== FINALE ===== */
      #screen-finale {
        background: linear-gradient(180deg, #2a1a0a, #120a04);
      }
      .finale-gem {
        font-size: clamp(90px, 24vw, 150px);
        animation: float 2.5s ease-in-out infinite;
        filter: drop-shadow(0 0 40px rgba(120, 220, 255, 0.6));
      }
      .finale-title {
        font-size: clamp(32px, 8vw, 52px);
        font-weight: 900;
        background: linear-gradient(180deg, #ffe066, #ffb347);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 8px 0;
      }

      .confetti {
        position: absolute;
        font-size: 24px;
        pointer-events: none;
        z-index: 60;
        animation: fall 1.6s ease-in forwards;
      }
      @keyframes fall {
        0% {
          transform: translateY(-40px) rotate(0);
          opacity: 1;
        }
        100% {
          transform: translateY(100vh) rotate(600deg);
          opacity: 0;
        }
      }

      /* ===== HAND-GEMALTE PIRATEN-ADVENTURE-OPTIK ===== */
      body { background: radial-gradient(ellipse at 50% 15%, #244a55 0%, #10252f 54%, #07141d 100%); }
      #app { background: linear-gradient(160deg, #193844, #091923 76%); }
      .start-bg {
        background:
          radial-gradient(ellipse at 50% 78%, rgba(255,183,79,.24), transparent 42%),
          radial-gradient(ellipse at 15% 20%, rgba(43,139,139,.35), transparent 38%),
          radial-gradient(ellipse at 85% 35%, rgba(72,104,151,.3), transparent 35%),
          linear-gradient(160deg,#163d4a 0%,#102a38 52%,#071923 100%);
      }
      h1 {
        background: linear-gradient(180deg,#fff1b6 0%,#ffc76b 45%,#d8753e 100%);
        -webkit-background-clip:text; background-clip:text;
        filter: drop-shadow(0 3px 0 rgba(49,28,18,.7));
        letter-spacing:1.5px;
      }
      .sub { color:#d6e0d0; text-shadow:0 2px 4px #071923; }
      .pill {
        background:linear-gradient(145deg,rgba(22,51,57,.95),rgba(8,27,34,.94));
        border:1px solid rgba(255,205,126,.62); color:#fff0c8;
        box-shadow:0 5px 0 rgba(5,18,23,.38),0 9px 22px rgba(0,0,0,.3);
      }
      .pill.reise-pill { background:linear-gradient(145deg,#286b65,#16433f); color:#efffd9; }
      .map-wrap { padding:82px 10px 14px; }
      .pergament {
        max-width:650px; max-height:880px;
        filter:drop-shadow(0 20px 25px rgba(0,0,0,.45)) drop-shadow(0 0 1px #e9c98d);
      }
      .pergament-inner {
        border-radius:15px;
        background:
          radial-gradient(ellipse at 23% 24%,rgba(255,249,208,.7),transparent 31%),
          radial-gradient(ellipse at 78% 70%,rgba(130,72,32,.26),transparent 33%),
          radial-gradient(ellipse at 48% 52%,#e9d19b 0%,#d8b879 56%,#a97842 100%);
        box-shadow:inset 0 0 0 3px rgba(106,63,32,.45),inset 0 0 30px rgba(72,37,16,.4);
      }
      .pergament-inner::before {
        background:
          radial-gradient(ellipse at 50% 0%,rgba(68,37,17,.64),transparent 20%),
          radial-gradient(ellipse at 50% 100%,rgba(68,37,17,.64),transparent 20%),
          radial-gradient(ellipse at 0% 50%,rgba(68,37,17,.58),transparent 18%),
          radial-gradient(ellipse at 100% 50%,rgba(68,37,17,.58),transparent 18%),
          repeating-linear-gradient(7deg,transparent 0 8px,rgba(93,61,28,.035) 9px 10px),
          radial-gradient(ellipse at 14% 16%,rgba(102,58,25,.24),transparent 20%),
          radial-gradient(ellipse at 87% 84%,rgba(102,58,25,.28),transparent 23%);
      }

      /* Klassische, handgemalte Piraten-Abenteueroptik */
      body { background: radial-gradient(ellipse at 50% 18%, #42616a 0%, #182e35 52%, #09151a 100%); }
      .start-bg {
        background: radial-gradient(ellipse at 50% 20%, rgba(224,159,76,.24), transparent 42%),
                    radial-gradient(ellipse at 15% 78%, rgba(48,112,108,.30), transparent 38%),
                    linear-gradient(155deg,#263d3d 0%,#14282b 52%,#091619 100%);
      }
      .logo { filter: drop-shadow(0 5px 0 rgba(49,25,12,.85)) drop-shadow(0 10px 18px rgba(242,173,75,.3)); }
      .pergament { filter: drop-shadow(0 18px 25px rgba(0,0,0,.58)) drop-shadow(0 0 4px rgba(26,12,4,.85)); }
      .pergament-inner {
        border-radius: 4px;
        background:
          radial-gradient(ellipse at 50% 48%, rgba(255,238,184,.38), transparent 57%),
          radial-gradient(ellipse at 12% 12%, rgba(45,20,7,.78), transparent 19%),
          radial-gradient(ellipse at 91% 13%, rgba(57,24,7,.72), transparent 17%),
          radial-gradient(ellipse at 8% 88%, rgba(47,20,6,.84), transparent 20%),
          radial-gradient(ellipse at 92% 91%, rgba(43,17,5,.82), transparent 20%),
          radial-gradient(ellipse at 50% 50%, #eed9a7 0%, #d9b979 65%, #95602f 100%);
        box-shadow: inset 0 0 0 2px rgba(70,34,12,.65), inset 0 0 24px 7px rgba(58,25,7,.48), inset 0 0 55px rgba(30,12,3,.42);
      }
      .pergament-inner::before {
        background:
          radial-gradient(ellipse at 0% 0%, rgba(38,14,3,.92), transparent 22%),
          radial-gradient(ellipse at 100% 0%, rgba(48,18,3,.88), transparent 20%),
          radial-gradient(ellipse at 0% 100%, rgba(36,13,3,.94), transparent 23%),
          radial-gradient(ellipse at 100% 100%, rgba(42,15,3,.92), transparent 22%),
          radial-gradient(ellipse at 50% 0%, rgba(67,30,8,.45), transparent 15%),
          radial-gradient(ellipse at 50% 100%, rgba(67,30,8,.45), transparent 15%),
          repeating-linear-gradient(7deg, transparent 0 7px, rgba(80,48,20,.055) 8px 9px);
      }
      .pergament-inner::after { box-shadow: inset 0 0 34px 7px rgba(45,17,4,.55), inset 0 0 4px 2px rgba(43,17,4,.8); }
      .truhe-node { filter: drop-shadow(0 3px 2px rgba(35,17,6,.5)); }

      /* ============================================================
   VERBESSERTE VORLESE-FUNKTION
   ============================================================ */
      let verfuegbareStimmen = [];
      let gewaehlteStimme = null;

      function ladeStimmen() {
        if (!("speechSynthesis" in window)) return;
        verfuegbareStimmen = window.speechSynthesis.getVoices();
        if (verfuegbareStimmen.length === 0) {
          window.speechSynthesis.onvoiceschanged = () => {
            verfuegbareStimmen = window.speechSynthesis.getVoices();
            waehleBesteStimme();
          };
        } else {
          waehleBesteStimme();
        }
      }

      function waehleBesteStimme() {
        const deutsche = verfuegbareStimmen.filter(
          (v) => v.lang && v.lang.toLowerCase().startsWith("de"),
        );
        if (deutsche.length === 0) {
          gewaehlteStimme = null;
          return;
        }
        // Bevorzuge installierte hochwertige deutsche Stimmen; verfügbar je nach Gerät.
        const prioritaeten = [
          /de-DE.*(natural|neural|premium|enhanced)/i,
          /(google|microsoft).*(deutsch|german|de-de)/i,
          /(natural|neural|premium|enhanced)/i,
          /katja/i, /hedda/i, /anna/i, /petra/i, /markus/i, /stefan/i,
        ];
        for (const p of prioritaeten) {
          const treffer = deutsche.find((v) => p.test(v.name));
          if (treffer) {
            gewaehlteStimme = treffer;
            return;
          }
        }
        gewaehlteStimme = deutsche[0];
      }

      if ("speechSynthesis" in window) {
        ladeStimmen();
        window.speechSynthesis.onvoiceschanged = () => {
          verfuegbareStimmen = window.speechSynthesis.getVoices();
          if (!gewaehlteStimme) waehleBesteStimme();
        };
      }

      function vorlesen() {
        if (!state.aktuelleAufgabe) return;
        if (!("speechSynthesis" in window)) {
          alert("Vorlesen wird von diesem Browser nicht unterstützt.");
          return;
        }
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(state.aktuelleAufgabe.sprechtext);
        if (!gewaehlteStimme) waehleBesteStimme();
        if (gewaehlteStimme) u.voice = gewaehlteStimme;
        u.lang = "de-DE";
        u.rate = 0.86;
        u.pitch = 1.0;
        u.volume = 1.0;
        window.speechSynthesis.speak(u);
      }

      function stimmeWechseln() {
        const deutsche = verfuegbareStimmen.filter(
          (v) => v.lang && v.lang.toLowerCase().startsWith("de"),
        );
        if (deutsche.length === 0) {
          alert("Keine deutsche Stimme gefunden.");
          return;
        }
        const idx = deutsche.indexOf(gewaehlteStimme);
        const naechste = deutsche[(idx + 1) % deutsche.length];
        gewaehlteStimme = naechste;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance("Diese Stimme ist jetzt aktiv.");
        u.voice = naechste;
        u.lang = "de-DE";
        u.rate = 0.92;
        u.pitch = 1.05;
        window.speechSynthesis.speak(u);
      }

      /* ===== SCREEN-WECHSEL ===== */
      function zeige(id) {
        document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
        document.getElementById(id).classList.add("active");
      }

      function startGame(stufe) {
        state.stufe = stufe;
        const saved = localStorage.getItem("schatzinsel");
        if (saved) {
          try {
            const s = JSON.parse(saved);
            if (s.stufe === stufe && s.reise) state = { ...state, ...s };
          } catch (e) {}
        }
        renderMap();
        zeige("screen-map");
      }

      function goMap() {
        clearInterval(timerIntervall);
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
        closeOverlay();
        renderMap();
        zeige("screen-map");
      }

            g.appendChild(el("circle", { cx: 0, cy: 0, r: 1.55, fill: "#a96b3b", stroke: "#56331f", "stroke-width": ".25" }));

            g.appendChild(el("path", { d: "M-.35,.72 Q0,.98 .38,.68", fill: "none", stroke: "#56331f", "stroke-width": ".18", "stroke-linecap": "round" }));
            // Kleine schwarze Piratenkopfbinde mit goldenem Totenkopf-Punkt.
            g.appendChild(el("path", { d: "M-1.35,-.72 Q0,-1.72 1.35,-.72 L1.18,-.25 Q0,-.72 -1.18,-.25 Z", fill: "#252b2c", stroke: "#171a1a", "stroke-width": ".16" }));

            return { group: g, palm: p };
          });
          palmen.forEach((p) => drawPalme(p.x, p.y, p.s));

          if (window.piratenaffeTimer) clearInterval(window.piratenaffeTimer);
          let sichtbarerAffe = null;
          const affeZeigen = () => {
            if (sichtbarerAffe) {

            const groesse = 0.48 * kandidat.palm.s;
            kandidat.group.setAttribute("opacity", "1");
            kandidat.group.setAttribute("transform", `translate(${kandidat.palm.x + 1.7}, ${kandidat.palm.y - 3.2}) scale(${groesse})`);
            // Kurz hervorlugen, dann wieder verschwinden.
            setTimeout(() => {
              if (sichtbarerAffe === kandidat) {

            }, 650);
            setTimeout(() => {
              if (sichtbarerAffe === kandidat) {
                kandidat.group.setAttribute("opacity", "0");
                kandidat.group.setAttribute("transform", `translate(${kandidat.palm.x + 1.7}, ${kandidat.palm.y - 3.2}) scale(0.01)`);

          };
          // Erst nach einer kleinen Wartezeit, danach in unregelmäßigen Abständen.
          setTimeout(affeZeigen, 3200 + Math.random() * 2500);
          window.piratenaffeTimer = setInterval(affeZeigen, 8500 + Math.random() * 3500);
          // Büsche
          [
            [5, 75, 1.2],
            [8, 80, 1],
            [92, 60, 1.1],
            [95, 70, 0.9],
            [45, 20, 1],
            [55, 25, 0.9],
            [80, 68, 1.1],
            [28, 60, 0.9],
          ].forEach((p) => {

            g.appendChild(
              el("circle", { cx: 1.2, cy: 0.3, r: 1.1, fill: "#3a7a2a", opacity: "0.85" }),

          });
        } else if (state.reise === "unterwasser") {
          // Wellen (blau)
          for (let i = 0; i < 6; i++) {
            svg.appendChild(
              el("path", {
                d: `M${2 + i * 16},5 Q${6 + i * 16},3.5 ${10 + i * 16},5 T${18 + i * 16},5`,

            svg.appendChild(
              el("path", {

          // Fische
          function drawFisch(cx, cy, scale, color) {

              el("ellipse", { cx: 0, cy: 0, rx: 3, ry: 1.5, fill: color, opacity: "0.7" }),

            g.appendChild(

            g.appendChild(el("circle", { cx: 1.5, cy: -0.3, r: 0.3, fill: "#1a3a4a" }));
            svg.appendChild(g);
          }
          drawFisch(10, 20, 1.2, "#f0a040");
          drawFisch(88, 30, 1.1, "#40c0f0");
          drawFisch(50, 10, 1.0, "#f06060");
          drawFisch(75, 75, 1.1, "#f0d040");
          drawFisch(20, 55, 1.0, "#a060f0");
          // Seegras
          function drawSeegras(cx, cy, scale) {
            const g = el("g", { transform: `translate(${cx}, ${cy}) scale(${scale})` });
            g.appendChild(
              el("path", {
                d: "M0,3 Q-1,1 -0.5,-2 Q0.5,-4 0,-7",

          // Muscheln

        } else if (state.reise === "weltraum") {

          // Rakete

        comp.appendChild(
          el("path", {

        comp.appendChild(
          el("path", {

        );
        ["N", "S", "O", "W"].forEach((dir, i) => {
          const pos = [

          t.textContent = dir;
          comp.appendChild(t);

        svg.appendChild(comp);

        /* ---- Titel-Banner ---- */
        const bannerW = 38,
          bannerX = 50 - bannerW / 2,
          bannerY = 4;
        svg.appendChild(
          el("path", {
            d: `M${bannerX} ${bannerY} L${bannerX + bannerW} ${bannerY} L${bannerX + bannerW - 2} ${bannerY + 5} L${bannerX + bannerW / 2} ${bannerY + 7} L${bannerX + 2} ${bannerY + 5} Z`,
            fill: "#8a6030",
            stroke: "#5a3a18",
            "stroke-width": "0.3",
          }),
        );
        const titel = el("text", {
          x: 50,
          y: bannerY + 4,
          "text-anchor": "middle",
          "font-size": "2.4",
          "font-weight": "bold",
          fill: "#ffe9b0",
          "letter-spacing": "0.3",
        });
        titel.textContent = "SCHATZKARTE";
        svg.appendChild(titel);

        /* ---- X beim Ziel ---- */
        const ziel = POSITIONEN[POSITIONEN.length - 1];
        const xMark = el("text", {
          x: ziel.x + 7,
          y: ziel.y - 3,
          "font-size": "4.5",
          "text-anchor": "middle",
          "font-weight": "bold",
          fill: "#a02010",
          opacity: "0.85",
        });
        xMark.textContent = "✕";
        svg.appendChild(xMark);

        /* ---- Durchgehender Schatzpfad: eine einzige Linie, die exakt durch
           die Mitte jeder Truhe läuft (keine voneinander getrennten Kurven). ---- */
        const routeD = POSITIONEN.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ");
        svg.appendChild(el("path", {
          d: routeD,

          stroke: "#746c5a",
          "stroke-width": "0.35",

          "stroke-dasharray": "1.1 2.4",

        }));

        /* ---- Truhen ---- */
        const layer = document.getElementById("truhenLayer");
        layer.innerHTML = "";
        POSITIONEN.forEach((pos, i) => {
          const el2 = document.createElement("div");
          el2.className = "truhe-node";
          el2.style.left = pos.x + "%";
          el2.style.top = pos.y + "%";

          const num = document.createElement("div");
          num.className = "station-num";
          num.textContent = i + 1;

          if (i < state.station) {
            el2.classList.add("done");
          } else if (i === state.station) {
            el2.classList.add("current");
            el2.onclick = () => oeffneTruheOverlay(i);
            el2.setAttribute("aria-label", `Schatztruhe ${i + 1} öffnen`);
          } else {
            el2.classList.add("locked");
            el2.setAttribute("aria-label", `Schatztruhe ${i + 1}, noch gesperrt`);
          }
          el2.innerHTML = `<span class="chest-art"><i class="chest-lid"></i><i class="chest-body"></i><i class="chest-band"></i><i class="chest-lock">${i < state.station ? "★" : i === state.station ? "✦" : "•"}</i></span>`;
          el2.appendChild(num);
          layer.appendChild(el2);
        });

        speichern();
      }

      function speichern() {
        localStorage.setItem("schatzinsel", JSON.stringify(state));
      }

      function oeffneTruheOverlay(index) {
        if (index !== state.station) return;
        const r = REISEN[state.reise] || REISEN.dschungel;
        document.getElementById("truheBig").innerHTML = `<span class="chest-art chest-art-big"><i class="chest-lid"></i><i class="chest-body"></i><i class="chest-band"></i><i class="chest-lock">✦</i></span><span class="chest-theme-mark">${r.truheIcon}</span>`;
        document.getElementById("truheBig").classList.remove("opening");
        document.getElementById("overlayHint").textContent = "Tippe die Truhe an!";
        document.getElementById("overlayHint").style.display = "block";
        document.getElementById("truheOverlay").classList.add("active");
      }

      function closeOverlay() {
        document.getElementById("truheOverlay").classList.remove("active");
      }

      function oeffneTruhe() {
        const big = document.getElementById("truheBig");
        if (big.classList.contains("opening")) return;
        big.classList.add("opening");
        document.getElementById("overlayHint").style.display = "none";
        setTimeout(() => {
          const pool = (REISEN[state.reise] || REISEN.dschungel).pool.filter(
            (a) => a.stufe === state.stufe,
          );
          let kandidaten = pool.filter((a) => a.id !== state.letzteId);
          if (kandidaten.length === 0) kandidaten = pool;
          const aufgabe = kandidaten[Math.floor(Math.random() * kandidaten.length)];
          state.aktuelleAufgabe = aufgabe;
          state.letzteId = aufgabe.id;
          closeOverlay();
          zeigeAufgabe(aufgabe);
        }, 550);
      }

      let timerIntervall = null;
      let restSekunden = 0;
      function zeitFuerAufgabe(a) {
        // Jede Aufgabe bekommt dieselbe entspannte Zeitspanne.
        return 120;
      }
      function starteTimer(a) {
        clearInterval(timerIntervall);
        restSekunden = 120;
        const el = document.getElementById("taskTimer");
        el.classList.remove("urgent");
        el.textContent = "⏱️ 2:00 Minuten – ihr habt Zeit!";
        timerIntervall = setInterval(() => {
          restSekunden--;
          if (restSekunden <= 15) el.classList.add("urgent");
          if (restSekunden > 0) {
            const min = Math.floor(restSekunden / 60);
            const sek = String(restSekunden % 60).padStart(2, "0");
            el.textContent = `⏱️ Noch ${min}:${sek} Minuten`;
          } else {
            clearInterval(timerIntervall);
            el.textContent = "💛 Zeit ist um – ihr dürft euch einen Tipp holen oder in Ruhe weitermachen!";
            zeigeTipp(true);
          }
        }, 1000);
      }
      function loesungFuer(a) {
        if (a.antwort) return a.antwort;
        const t = (a.sprechtext || "").toLowerCase();
        if (a.kategorie === "raetsel") {
          if (/miau|klettert gern/.test(t)) return "Eine Katze! 🐱";
          if (/vier beine und bellt/.test(t)) return "Ein Hund! 🐶";
          if (/leuchtet nachts/.test(t) && /himmel|dschungel/.test(t)) return "Der Mond oder die Sterne. 🌙⭐";
          if (/aufmachen und wieder schließen|öffnen und schließen/.test(t)) return "Zum Beispiel eine Tür, eine Schachtel oder ein Buch. 🚪";
          if (/quak/.test(t)) return "Ein Frosch! 🐸";
          if (/fährst du auf der straße/.test(t)) return "Zum Beispiel ein Auto, Fahrrad oder Bus. 🚗";
          if (/trinkst du/.test(t)) return "Wasser! 💧";
          if (/scheint am tag/.test(t)) return "Die Sonne! ☀️";
          if (/an die füße/.test(t)) return "Schuhe oder Socken! 👟";
          if (/wenn du müde bist/.test(t)) return "Du ruhst dich aus oder schläfst. 😴";
          if (/vier beine, aber kann nicht laufen/.test(t)) return "Ein Tisch oder ein Stuhl. 🪑";
          if (/nass, wenn es trocknet/.test(t)) return "Ein Handtuch! 🧺";
          if (/zähne, aber keinen mund/.test(t)) return "Ein Kamm! 💇";
          if (/rund, aber keine kugel/.test(t)) return "Zum Beispiel ein Teller oder eine Münze. 🍽️";
          if (/fliegt ohne flügel/.test(t)) return "Die Zeit – oder ein Drachen im Wind, je nach Rätsel! 💨";
          if (/einen kopf, aber kein gesicht/.test(t)) return "Ein Nagel oder ein Kohlkopf. 🔩";
          if (/geht hoch, aber nie runter/.test(t)) return "Dein Alter! 🎂";
          if (/blätter, aber keinen baum/.test(t)) return "Ein Buch! 📖";
          if (/ein auge, aber sieht nicht/.test(t)) return "Eine Nadel. 🪡";
          if (/einen hals, aber keinen kopf/.test(t)) return "Eine Flasche! 🍼";
        }
        if (/welche farbe hat eine banane/.test(t)) return "Meistens gelb! 🍌";
        if (/welche farbe hat gras/.test(t)) return "Grün! 🌿";
        if (/blau und gelb mischt/.test(t)) return "Grün! 💚";
        if (/form hat ein würfel/.test(t)) return "Ein Würfel ist ein Körper mit sechs quadratischen Seiten. 🧊";
        if (/form hat ein ball/.test(t)) return "Rund – wie eine Kugel! ⚽";
        return "Tipp: Schau dich gemeinsam mit deinem Team um. Es gibt nicht nur eine richtige Lösung – erklärt, warum eure Idee passt! 🤝";
      }
      function nichtGeschafft() {
        clearInterval(timerIntervall);
        const a = state.aktuelleAufgabe;
        if (!a) return;
        const box = document.getElementById("taskHelp");
        box.style.display = "block";
        const loesung = loesungFuer(a);
        box.textContent = "🙈 Kein Problem! Die Antwort ist: " + loesung;
        document.getElementById("taskTimer").textContent = "💛 Ihr könnt die Antwort in Ruhe anschauen und danach auf „Geschafft“ tippen.";
        document.getElementById("taskTimer").classList.remove("urgent");
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance("Kein Problem! Die Antwort ist: " + loesung);
          if (!gewaehlteStimme) waehleBesteStimme();
          if (gewaehlteStimme) u.voice = gewaehlteStimme;
          u.lang = "de-DE"; u.rate = 0.86; window.speechSynthesis.speak(u);
        }
      }

      function zeigeTipp(automatisch = false) {
        const a = state.aktuelleAufgabe;
        if (!a) return;
        const box = document.getElementById("taskHelp");
        box.style.display = "block";
        const loesung = loesungFuer(a);
        box.textContent = (automatisch ? "⏰ Zeit um! " : "💡 ") + loesung;
        if (automatisch && "speechSynthesis" in window) {
          const u = new SpeechSynthesisUtterance(loesung);
          if (!gewaehlteStimme) waehleBesteStimme();
          if (gewaehlteStimme) u.voice = gewaehlteStimme;
          u.lang = "de-DE"; u.rate = 0.86; window.speechSynthesis.speak(u);
        }
      }
      function zeigeAufgabe(a) {
        document.getElementById("taskIcon").textContent = a.icon;
        document.getElementById("taskText").textContent = a.sprechtext;
        document.getElementById("taskHelp").style.display = "none";
        document.getElementById("taskHelp").textContent = "";
        zeige("screen-task");
        starteTimer(a);
        setTimeout(vorlesen, 350);
      }

      function nochMal() {
        vorlesen();
      }

      function erledigt() {
        clearInterval(timerIntervall);
        const a = state.aktuelleAufgabe;
        if (!a) return;
        state.sterne = Math.min(state.sterne + 1, STATIONEN);
        if (a.teamStern) state.teamSterne++;
        state.station = Math.min(state.station + 1, STATIONEN);
        const txt = document.getElementById("rewardText");
        const sub = document.getElementById("rewardSub");
        if (a.teamStern) {
          txt.textContent = "Super gemacht! ⭐ + 🤝⭐";
          sub.textContent = "Du bekommst einen Stern UND einen Team-Stern!";
        } else {
          txt.textContent = "Super gemacht! ⭐";
          sub.textContent = "Dein Stern wandert auf die Schatzkarte!";
        }
        speichern();
        zeige("screen-reward");
        konfetti();
        if (state.station >= STATIONEN) {
          setTimeout(() => {
            const r = REISEN[state.reise] || REISEN.dschungel;
            document.getElementById("finaleIcon").textContent = r.finaleIcon;
            document.getElementById("finaleTitle").textContent = r.name + " geschafft!";
            zeige("screen-finale");
          }, 1800);
        }
      }

      function konfetti() {
        const app = document.getElementById("app");
        for (let i = 0; i < 14; i++) {
          const c = document.createElement("div");
          c.className = "confetti";
          c.textContent = ["⭐", "✨", "🤝", "🎉", "💫"][Math.floor(Math.random() * 5)];
          c.style.left = 10 + Math.random() * 80 + "%";
          c.style.top = "-40px";
          c.style.animationDelay = Math.random() * 0.4 + "s";
          app.appendChild(c);
          setTimeout(() => c.remove(), 2200);
        }
      }

      function neueReise() {
        clearInterval(timerIntervall);
        const idx = REIHENFOLGE.indexOf(state.reise);
        state.reise = idx < REIHENFOLGE.length - 1 ? REIHENFOLGE[idx + 1] : REIHENFOLGE[0];
        state.station = 0;
        state.sterne = 0;
        state.teamSterne = 0;
        state.aktuelleAufgabe = null;
        state.letzteId = null;
        speichern();
        renderMap();
        zeige("screen-map");
      }

      function resetGame() {
        if (confirm("Möchtest du wirklich neu starten? Der Fortschritt wird gelöscht.")) {
          state = {
            stufe: state.stufe,
            reise: state.reise,
            station: 0,
            sterne: 0,
            teamSterne: 0,
            aktuelleAufgabe: null,
            letzteId: null,
          };
          speichern();
          renderMap();
          zeige("screen-map");
        }
      }
    </script>
  </body>
</html>
